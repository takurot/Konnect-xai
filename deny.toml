# cargo-deny configuration: dependency license and advisory gates.
#
# Konnect is AGPL-3.0 with a commercial dual license (COMMERCIAL.md), so every
# dependency's license matters twice: it must be AGPL-compatible AND
# redistributable under a proprietary commercial grant. Everything allowed
# below satisfies both. Notably MPL-2.0 (resvg's family) is file-level
# copyleft: fine to link, but commercial distributions must keep those files'
# source available — recorded in THIRD_PARTY.md territory, not a blocker.
#
# Run locally: cargo deny check licenses

[licenses]
allow = [
    # The project's own license (workspace members).
    "AGPL-3.0-only",
    "MIT",
    # MIT No Attribution is MIT-equivalent and permits commercial redistribution.
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
    # Mozilla's root-CA certificate data (webpki-root-certs via reqwest).
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[licenses.private]
# Workspace members carry the project's own AGPL-3.0-only; they are not
# published to crates.io and are exempted from the allow list above.
ignore = true

[advisories]
# Gated by the CI `advisories` job, separate from `licenses` so a new RUSTSEC
# entry cannot block an unrelated license check. Its weekly schedule catches
# advisories published against an unchanged Cargo.lock.
# Run locally: cargo deny check advisories
version = 2
yanked = "warn"
ignore = [
    { id = "RUSTSEC-2026-0441", reason = "pin-utils (unmaintained, no vulnerability): hyper still depends on it and no replacement release exists" },
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml (unmaintained): only via konnect's serde_yaml_ng dev-dependency, which parses repository-owned workflow YAML in tests" },
]

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
