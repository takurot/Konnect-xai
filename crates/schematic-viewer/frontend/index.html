<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schematic Viewer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="toolbar">
  <span class="filename" id="filename">No file loaded</span>
  <select id="sheet-selector" hidden></select>
  <!-- Status sits on the left of the flexible spacer: its text changes
       constantly (Live / Rendering / errors), and when it lived at the far
       right it kept shifting the buttons sideways under the cursor. -->
  <span class="status" id="status">Waiting...</span>
  <div class="spacer"></div>
  <button id="zoom-in" title="Zoom in (+)">Zoom +</button>
  <button id="zoom-out" title="Zoom out (-)">Zoom -</button>
  <span class="zoom-display" id="zoom-display">100%</span>
  <button id="fit-to-page" title="Fit to window (0)">Fit</button>
  <button id="refresh" title="Re-render the current sheet (R)">Refresh</button>
  <button id="theme" title="Toggle dark/light theme">Theme</button>
  <button id="open-in-kicad" title="Open this project in KiCAD">Open in KiCAD</button>
</div>

<div id="viewer">
  <div id="svg-container">
    <img id="schematic-image" alt="Schematic sheet" draggable="false" hidden>
  </div>
  <div class="overlay" id="empty-state">
    <h2>Konnect</h2>
    <p>Schematic Viewer</p>
    <p>Drag a .kicad_sch file here or use the MCP tool to open</p>
  </div>
  <div class="overlay" id="loading-overlay" hidden>
    <div class="spinner"></div>
    <h2 id="loading-text">Rendering…</h2>
  </div>
</div>

<div class="flash" id="flash">Updated</div>

<script src="main.js" defer></script>
</body>
</html>
